  <g id="text_13">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Space Grotesk'; fill: #1a1d21" transform="translate(12 22)">Median 2026-27 superintendent base</text>
   <text style="font-weight: 700; font-size: 13px; font-family: 'Space Grotesk'; fill: #1a1d21" transform="translate(12 39)">salary is $206,606 across 551 NJ</text>
   <text style="font-weight: 700; font-size: 13px; font-family: 'Space Grotesk'; fill: #1a1d21" transform="translate(12 56)">districts; 490 of 551 fall between</text>
   <text style="font-weight: 700; font-size: 13px; font-family: 'Space Grotesk'; fill: #1a1d21" transform="translate(12 73)">$150,000 and $280,000</text>
  </g>
  <g id="text_14">
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 90)">Districts per $10,000 salary bin (each</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 105.5)">bin includes its lower edge), latest</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 121)">reported base salary on the</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 136.5)">k12comp.com New Jersey list, 2026-27</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 152)">rows only, US dollars per year</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 388.97)">Of 586 listed districts, 35 are left</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 404.47)">out: 11 not reported ($0 in source)</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 419.97)">and 24 whose latest reported year is</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 435.47)">before 2026-27. Source: NJDOE</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 450.97)">User-Friendly Budget files via</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 466.47)">k12comp.com New Jersey list</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 481.97)">(k12comp-web commit 59bdb5b). Median =</text>
   <text style="font-size: 12px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(12 497.47)">276th of 551 values, sorted.</text>
  </g>
