  <g id="text_16">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Space Grotesk'; fill: #1a1d21" transform="translate(16.128 23.136)">Median 2026-27 superintendent base salary is $206,606 across 551 NJ districts; 490 of 551 fall</text>
   <text style="font-weight: 700; font-size: 14px; font-family: 'Space Grotesk'; fill: #1a1d21" transform="translate(16.128 41)">between $150,000 and $280,000</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(16.128 57.9232)">Districts per $10,000 salary bin (each bin includes its lower edge), latest reported base salary on the k12comp.com New Jersey list, 2026-27</text>
   <text style="font-size: 10px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(16.128 70.6832)">rows only, US dollars per year</text>
  </g>
  <g id="text_18">
   <text style="font-size: 7.5px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(16.128 358.1472)">Of 586 listed districts, 35 are left out: 11 not reported ($0 in source) and 24 whose latest reported year is before 2026-27. Source: NJDOE User-Friendly Budget files via k12comp.com New</text>
   <text style="font-size: 7.5px; font-family: 'Space Grotesk'; fill: #5b6470" transform="translate(16.128 367.7172)">Jersey list (k12comp-web commit 59bdb5b). Median = 276th of 551 values, sorted.</text>
  </g>
